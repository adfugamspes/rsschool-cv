<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gifts</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Allura&display=swap" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Allura&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <div class="container">
            <div class="header-container">
                <div class="logo">
                    <img alt="snowflake" src="assets/Vector.png">
                    THE GIFTS
                </div>
                <nav class="nav-menu">
                    <ul class="nav-menu-items">
                        <li><a href="#">GIFTS</a></li>
                        <li><a href="#">ABOUT</a></li>
                        <li><a href="#">BEST</a></li>
                        <li><a href="#">CONTACTS</a></li>
                    </ul>
                </nav>

            </div>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="gift-section">
                <div class="gift-garland-container">
                    <h1>Achieve health, harmony, and inner strength</h1>
                    <div class="tabs-container">
                        <button class="tab-item">All</button>
                        <button class="tab-item">For Work</button>
                        <button class="tab-item">For Health</button>
                        <button class="tab-item">For Harmony</button>
                    </div>

                    <div class="cards-container">
                        <div class="card">
                            <img alt="card-1" src="assets/gift-for-work.png">
                            <div class="card-bottom blue">
                                <h4>For work</h4>
                                <h3>Console.log Guru</h3>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <div class="footer-container">
                <div class="contact-info">
                    <div class="contact-info-card">
                        <img alt="phone-image" src="assets/santa-claus.svg">
                        <p>+375 (29) 111-22-33</p>
                        <h3>Call Us</h3>
                    </div>
                    <div class="contact-info-card">
                        <img alt="phone-image" src="assets/christmas-tree.svg">
                        <p>Magic forest</p>
                        <h3>meet us</h3>
                    </div>
                    <div class="contact-info-card">
                        <img alt="phone-image" src="assets/snake.svg">
                        <p>gifts@magic.com</p>
                        <h3>write us</h3>
                    </div>
                </div>
                <div class="footer-info">
                    <div class="footer-copyright">
                        <div class="social-networks">
                            <img alt="telegram" src="assets/telegram.png">
                            <img alt="facebook" src="assets/facebook.png">
                            <img alt="instagram" src="assets/instagram.png">
                            <img alt="x-twitter" src="assets/X.png">
                        </div>
                        <p>© Copyright 2025, All Rights Reserved</p>
                        <p>Made in Rolling Scopes School</p>
                    </div>
                </div>
            </div>
    </footer>

</body>

</html>
